name: Ferric Android CI & Dual-APK Build

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/ferric-android/**"
      - "scripts/build-android.ps1"
      - ".github/workflows/ci-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/ferric-android/**"
      - "scripts/build-android.ps1"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ferric-android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  android-build-and-verify:
    name: Rust Core, 3-ABI NDK, Gradle Tests, Lint & Dual APKs (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust stable with Android targets
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Configure Java and Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_21_X64:-}" ] && [ -d "${JAVA_HOME_21_X64}" ]; then
            echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
            echo "${JAVA_HOME_21_X64}/bin" >> "$GITHUB_PATH"
          elif [ -n "${JAVA_HOME_17_X64:-}" ] && [ -d "${JAVA_HOME_17_X64}" ]; then
            echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
            echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK_ROOT}" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Check formatting, Clippy, and unit tests on shared Rust crates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy -p ferric-core -p ferric-audio -p ferric-providers -p ferric-sync -p ferric-controller -p ferric-mobile-ffi --all-targets --locked -- -D warnings
          cargo test -p ferric-core -p ferric-audio -p ferric-providers -p ferric-sync -p ferric-controller -p ferric-mobile-ffi --locked

      - name: Build Android native libraries (arm64-v8a, armeabi-v7a, x86_64) with 16 KB ELF alignment
        shell: bash
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          set -euo pipefail
          mkdir -p apps/ferric-android/app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            --platform 28 \
            -o apps/ferric-android/app/src/main/jniLibs \
            build --release -p ferric-mobile-ffi --locked

      - name: Verify 16 KB ELF LOAD alignment on 64-bit native libraries
        shell: bash
        run: |
          set -euo pipefail
          READELF="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in arm64-v8a x86_64; do
            SO="apps/ferric-android/app/src/main/jniLibs/${abi}/libferric_mobile_ffi.so"
            test -f "${SO}"
            "${READELF}" -l "${SO}" | awk '
              $1 == "LOAD" {
                found++;
                align = strtonum($NF);
                if (align < 16384) {
                  print "ERROR: alignment < 16384 in " ENVIRON["SO"] ": " $0 > "/dev/stderr";
                  exit 1;
                }
              }
              END {
                if (found == 0) {
                  print "ERROR: no LOAD segments found" > "/dev/stderr";
                  exit 1;
                }
              }
            '
          done

      - name: Generate UniFFI Kotlin bindings
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p ferric-mobile-ffi --locked
          mkdir -p apps/ferric-android/app/build/generated/source/uniffi/kotlin
          cargo run -p ferric-mobile-ffi --features bindgen-cli --bin uniffi-bindgen -- generate \
            --library target/debug/libferric_mobile_ffi.so \
            --language kotlin \
            --out-dir apps/ferric-android/app/build/generated/source/uniffi/kotlin \
            --no-format

      - name: Run Android Gradle unit tests, lint, and dual-APK release build
        shell: bash
        working-directory: apps/ferric-android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Stage dual release APKs and SHA256SUMS.txt
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^version = "\([0-9]\+\.[0-9]\+\.[0-9]\+\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "${VER}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          mkdir -p dist/android
          cp apps/ferric-android/app/build/outputs/apk/release/app-arm64-v8a-release.apk \
             "dist/android/ferric-v${VER}-android-arm64-v8a.apk"
          cp apps/ferric-android/app/build/outputs/apk/release/app-universal-release.apk \
             "dist/android/ferric-v${VER}-android-universal.apk"
          (
            cd dist/android
            sha256sum "ferric-v${VER}-android-arm64-v8a.apk" "ferric-v${VER}-android-universal.apk" > SHA256SUMS.txt
          )
          ls -lh dist/android/
          cat dist/android/SHA256SUMS.txt

      - name: Upload Android dual APKs and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ferric-v${{ steps.stage.outputs.version }}-android-apks
          path: |
            dist/android/ferric-v${{ steps.stage.outputs.version }}-android-arm64-v8a.apk
            dist/android/ferric-v${{ steps.stage.outputs.version }}-android-universal.apk
            dist/android/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
