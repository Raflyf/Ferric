name: Ferric Desktop CI & Artifact Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "assets/ui_previews/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "assets/ui_previews/**"
  workflow_dispatch:

concurrency:
  group: ferric-desktop-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check-and-test:
    name: Check, Clippy & Unit Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy across workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace unit tests
        run: cargo test --workspace --locked

      - name: Validate PowerShell delivery scripts
        shell: pwsh
        run: |
          foreach ($path in Get-ChildItem scripts/*.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }

  build-windows-artifact:
    name: Build Windows MSI Setup & Portable ZIP (v0.1.0)
    needs: check-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Read package version
        id: meta
        shell: pwsh
        run: |
          $toml = Get-Content -Raw Cargo.toml
          if ($toml -match '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"') {
            $ver = $Matches[1]
          } else {
            throw "Numeric X.Y.Z version missing in Cargo.toml"
          }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build release binary (ferric.exe)
        env:
          MAKEPAD_PACKAGE_DIR: makepad
        run: cargo build --release -p ferric-desktop --locked

      - name: Build Windows MSI installer (ferricsetup-vX.Y.Z.msi)
        shell: pwsh
        run: |
          & .\scripts\Installer.ps1
          $msi = @(Get-ChildItem -LiteralPath .\dist -Filter 'ferricsetup-v*.msi' -File)
          if ($msi.Count -ne 1) { throw 'Expected exactly one versioned MSI installer.' }

      - name: Package portable Windows archive & SHA256SUMS
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $stage = "dist/Ferric-v$ver-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$stage/resources" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/makepad/makepad_widgets/resources" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/makepad/ferric_desktop/resources" | Out-Null

          Copy-Item "target/release/ferric.exe" "$stage/ferric.exe"
          Copy-Item "README.md" "$stage/README.md"
          Copy-Item "LICENSE" "$stage/LICENSE"
          Copy-Item "CHANGELOG.md" "$stage/CHANGELOG.md"
          Copy-Item "assets/brand/ferric.ico" "$stage/resources/ferric.ico"
          Copy-Item "assets/brand/ferric.png" "$stage/resources/ferric.png"
          Copy-Item "apps/ferric-desktop/resources/*" "$stage/makepad/ferric_desktop/resources/" -Force

          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $mwRes = Get-ChildItem (Join-Path $cargoHome "registry/src") -Recurse -Directory -Filter "makepad-widgets-*" |
            ForEach-Object { Join-Path $_.FullName "resources" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $mwRes) {
            throw "Failed to locate makepad-widgets resources directory under $cargoHome"
          }
          Copy-Item "$mwRes/*" "$stage/makepad/makepad_widgets/resources/" -Recurse -Force
          if (-not (Test-Path "$stage/makepad/makepad_widgets/resources/IBMPlexSans-Text.ttf")) {
            throw "IBMPlexSans-Text.ttf missing from staged portable Makepad resources"
          }

          $msiName = "ferricsetup-v$ver.msi"
          $msiPath = "dist/$msiName"
          $zipName = "Ferric-v$ver-windows-x86_64.zip"
          $zipPath = "dist/$zipName"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force

          $msiHash = (Get-FileHash $msiPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash "$stage/ferric.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = "$msiHash  $msiName`n$zipHash  $zipName`n$exeHash  ferric.exe`n"
          [IO.File]::WriteAllText((Join-Path $PWD "dist\SHA256SUMS.txt"), $sums, [Text.Encoding]::ASCII)

          Get-Item $msiPath, $zipPath | Select-Object Name, Length
          Get-Content "dist/SHA256SUMS.txt"

      - name: Upload downloadable preview artifact (MSI + ZIP + SHA256SUMS, no tag created)
        uses: actions/upload-artifact@v4
        with:
          name: Ferric-v${{ steps.meta.outputs.version }}-windows-x86_64
          path: |
            dist/ferricsetup-v${{ steps.meta.outputs.version }}.msi
            dist/Ferric-v${{ steps.meta.outputs.version }}-windows-x86_64.zip
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
