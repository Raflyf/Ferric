name: Ferric Android Tag Release (Manual Tag Push Only)

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build-android-release:
    name: Build, Verify & Sign Android Dual APKs (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag matches build.gradle.kts versionName
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^android-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "ERROR: Android release tag '${RELEASE_TAG}' must match android-vX.Y.Z" >&2
            exit 1
          fi
          TAG_VER="${BASH_REMATCH[1]}"
          GRADLE_VER="$(sed -n 's/.*versionName = "\([0-9]\+\.[0-9]\+\.[0-9]\+\)".*/\1/p' apps/ferric-android/app/build.gradle.kts | head -n 1)"
          if [ "${GRADLE_VER}" != "${TAG_VER}" ]; then
            echo "ERROR: Tag version (${TAG_VER}) does not match build.gradle.kts versionName (${GRADLE_VER})" >&2
            exit 1
          fi
          echo "version=${TAG_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust stable with Android targets
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Configure Java and Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_21_X64:-}" ] && [ -d "${JAVA_HOME_21_X64}" ]; then
            echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
            echo "${JAVA_HOME_21_X64}/bin" >> "$GITHUB_PATH"
          elif [ -n "${JAVA_HOME_17_X64:-}" ] && [ -d "${JAVA_HOME_17_X64}" ]; then
            echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
            echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          { yes 2>/dev/null || true; } | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK_ROOT}" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install cargo-ndk and Linux audio development libraries
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Check formatting, Clippy, and unit tests on shared Rust crates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy -p ferric-core -p ferric-audio -p ferric-providers -p ferric-sync -p ferric-controller -p ferric-mobile-ffi --all-targets --locked -- -D warnings
          cargo test -p ferric-core -p ferric-audio -p ferric-providers -p ferric-sync -p ferric-controller -p ferric-mobile-ffi --locked

      - name: Build Android native libraries (arm64-v8a, armeabi-v7a, x86_64) with 16 KB ELF alignment
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="${{ github.workspace }}/.cargo-ci-tmp"
          export CARGO_ENCODED_RUSTFLAGS=$'-C\x1flink-arg=-Wl,-z,max-page-size=16384\x1f--remap-path-prefix='"${{ github.workspace }}"$'=.\x1f--remap-path-prefix='"${CARGO_HOME}"$'=cargo-home'
          mkdir -p apps/ferric-android/app/src/main/jniLibs "${CARGO_HOME}"
          cp -r "${HOME}/.cargo/." "${CARGO_HOME}/" 2>/dev/null || true
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            --platform 28 \
            -o apps/ferric-android/app/src/main/jniLibs \
            build --release -p ferric-mobile-ffi --locked
          rm -rf "${CARGO_HOME}"

      - name: Verify 16 KB ELF LOAD alignment on 64-bit native libraries
        shell: bash
        run: |
          set -euo pipefail
          READELF="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in arm64-v8a x86_64; do
            SO="apps/ferric-android/app/src/main/jniLibs/${abi}/libferric_mobile_ffi.so"
            test -f "${SO}"
            python3 - "${SO}" "${READELF}" <<'PY'
          import subprocess, sys
          so, readelf = sys.argv[1], sys.argv[2]
          out = subprocess.check_output([readelf, "-l", so], text=True)
          found = 0
          for line in out.splitlines():
              parts = line.split()
              if parts and parts[0] == "LOAD":
                  found += 1
                  align = int(parts[-1], 0)
                  if align < 16384:
                      sys.exit(f"ERROR: alignment < 16384 in {so}: {line}")
          if found == 0:
              sys.exit(f"ERROR: no LOAD segments found in {so}")
          PY
          done

      - name: Generate UniFFI Kotlin bindings
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p ferric-mobile-ffi --locked
          mkdir -p apps/ferric-android/app/build/generated/source/uniffi/kotlin
          cargo run -p ferric-mobile-ffi --features bindgen-cli --bin uniffi-bindgen -- generate \
            --library target/debug/libferric_mobile_ffi.so \
            --language kotlin \
            --out-dir apps/ferric-android/app/build/generated/source/uniffi/kotlin \
            --no-format

      - name: Decode Android release keystore from repository secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FERRIC_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ERROR: FERRIC_KEYSTORE_BASE64 secret is required for release APK signing." >&2
            exit 1
          fi
          KS_FILE="${RUNNER_TEMP}/ferric-release.jks"
          printf '%s' "${KEYSTORE_B64}" | base64 -d > "${KS_FILE}"
          chmod 600 "${KS_FILE}"
          echo "FERRIC_KEYSTORE_PATH=${KS_FILE}" >> "$GITHUB_ENV"

      - name: Run Android Gradle unit tests, lint, and dual-APK release build
        shell: bash
        working-directory: apps/ferric-android
        env:
          FERRIC_KEYSTORE_PASSWORD: ${{ secrets.FERRIC_KEYSTORE_PASSWORD }}
          FERRIC_KEY_ALIAS: ${{ secrets.FERRIC_KEYSTORE_ALIAS }}
          FERRIC_KEY_PASSWORD: ${{ secrets.FERRIC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Remove temporary release keystore from runner
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/ferric-release.jks"

      - name: Verify APK signatures, stage release files & generate notes
        shell: bash
        env:
          VER: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          REPO_URL: https://github.com/${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          ARM64_NAME="ferric-v${VER}-android-arm64-v8a.apk"
          UNIV_NAME="ferric-v${VER}-android-universal.apk"
          mkdir -p dist/android
          cp apps/ferric-android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/android/${ARM64_NAME}"
          cp apps/ferric-android/app/build/outputs/apk/release/app-universal-release.apk "dist/android/${UNIV_NAME}"

          "${APKSIGNER}" verify --print-certs "dist/android/${ARM64_NAME}" > dist/android/arm64-certs.txt
          "${APKSIGNER}" verify --print-certs "dist/android/${UNIV_NAME}" > dist/android/univ-certs.txt
          SIGNER_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/android/arm64-certs.txt | head -n 1)"
          SIGNER_DN="$(sed -n 's/^Signer #1 certificate DN: //p' dist/android/arm64-certs.txt | head -n 1)"
          test -n "${SIGNER_SHA256}"
          if grep -qi "Android Debug" dist/android/arm64-certs.txt dist/android/univ-certs.txt; then
            echo "ERROR: APK is unexpectedly signed with debug certificate" >&2
            exit 1
          fi
          rm -f dist/android/arm64-certs.txt dist/android/univ-certs.txt

          (
            cd dist/android
            sha256sum "${ARM64_NAME}" "${UNIV_NAME}" > SHA256SUMS.txt
          )
          ARM64_SHA256="$(awk -v f="${ARM64_NAME}" '$2 == f {print $1}' dist/android/SHA256SUMS.txt)"
          UNIV_SHA256="$(awk -v f="${UNIV_NAME}" '$2 == f {print $1}' dist/android/SHA256SUMS.txt)"

          python3 - "${VER}" "${RELEASE_TAG}" "${REPO_URL}" "${RUN_URL}" "${ARM64_NAME}" "${UNIV_NAME}" "${ARM64_SHA256}" "${UNIV_SHA256}" "${SIGNER_DN}" "${SIGNER_SHA256}" <<'PY'
          import re, sys
          from pathlib import Path

          ver, tag, repo_url, run_url, arm64_name, univ_name, arm64_sha, univ_sha, dn, cert_sha = sys.argv[1:11]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^##\s+Android\s+v{re.escape(ver)}\b[^\r\n]*\r?\n(.*?)(?=^---\s*\r?\n|^##\s+|\Z)",
              re.M | re.S,
          )
          m = pattern.search(changelog)
          if not m:
              sys.exit(f"Missing '## Android v{ver}' section in CHANGELOG.md")
          body = m.group(1).strip()

          notes = "\n".join([
              f"## Ferric Android v{ver}",
              "",
              body,
              "",
              "---",
              "",
              "### Download and verification",
              "",
              f"- [Android arm64-v8a APK]({repo_url}/releases/download/{tag}/{arm64_name}) (`{arm64_name}`) - Recommended for modern phones (~16 MB)",
              f"- [Android Universal APK]({repo_url}/releases/download/{tag}/{univ_name}) (`{univ_name}`) - `arm64-v8a` + `armeabi-v7a` + `x86_64`",
              f"- [SHA256SUMS.txt]({repo_url}/releases/download/{tag}/SHA256SUMS.txt)",
              f"- [GitHub Actions release build]({run_url}): Rust checks, 3-ABI NDK 16 KB alignment, UniFFI bindings, Gradle unit tests, lint, and release APK signing passed.",
              "",
              f"**arm64-v8a APK SHA256:** `{arm64_sha}`",
              f"**Universal APK SHA256:** `{univ_sha}`",
              f"**Release Signer DN:** `{dn}`",
              f"**Release Certificate SHA256:** `{cert_sha}`",
              "",
              "### Installation notes",
              "",
              "- Signed with the consistent Ferric release keystore. Upgrading from older debug builds requires uninstalling the debug build once before installing the signed release APK.",
              "- If installing outside Google Play Store, enable **Install unknown apps** for your browser or file manager. If Google Play Protect prompts for scan/confirmation, allow scan or tap **More details -> Install anyway**.",
          ]) + "\n"
          Path("dist/android/RELEASE_NOTES.md").write_text(notes, encoding="utf-8")
          PY

      - name: Upload verified Android release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-payload
          path: |
            dist/android/ferric-v${{ steps.meta.outputs.version }}-android-arm64-v8a.apk
            dist/android/ferric-v${{ steps.meta.outputs.version }}-android-universal.apk
            dist/android/SHA256SUMS.txt
            dist/android/RELEASE_NOTES.md
          retention-days: 5
          if-no-files-found: error
          compression-level: 0

  publish-android-release:
    name: Publish Android GitHub Release
    needs: build-android-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Android release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-payload
          path: dist/android

      - name: Publish Android GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Ferric Android ${{ github.ref_name }}
          body_path: dist/android/RELEASE_NOTES.md
          generate_release_notes: false
          make_latest: false
          files: |
            dist/android/ferric-v*-android-arm64-v8a.apk
            dist/android/ferric-v*-android-universal.apk
            dist/android/SHA256SUMS.txt
