name: Ferric Tag Release (Manual Tag Push Only)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build, Verify & Package Windows MSI + Portable Release
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag matches Cargo.toml version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tag '$($env:RELEASE_TAG)' must match vX.Y.Z"
          }
          $tagVer = $Matches[1]
          $toml = Get-Content -Raw Cargo.toml
          if ($toml -notmatch '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"') {
            throw "Numeric X.Y.Z version missing in Cargo.toml"
          }
          if ($Matches[1] -ne $tagVer) {
            throw "Tag version ($tagVer) does not match Cargo.toml ($($Matches[1]))"
          }

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - name: Configure neutral CARGO_HOME (prevent runner username path leaks)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\c | Out-Null
          "CARGO_HOME=C:\c" >> $env:GITHUB_ENV

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting, Clippy, and unit tests before release
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Build hardened release binary
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Verify PE hardening flags and zero path/PDB leaks
        shell: pwsh
        run: python .\scripts\verify_pe_hardening.py target\release\ferric.exe

      - name: Build MSI installer & portable ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          & .\scripts\Installer.ps1
          $msiName = "ferricsetup-$tag.msi"
          $msiPath = Join-Path .\dist $msiName
          if (-not (Test-Path -LiteralPath $msiPath -PathType Leaf)) {
            throw "Expected MSI installer matching tag $tag at $msiPath"
          }

          $stage = "dist/Ferric-$tag-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$stage/resources" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/makepad/makepad_widgets/resources" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/makepad/ferric_desktop/resources" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/makepad/ferric/resources" | Out-Null
          Copy-Item "target/release/ferric.exe" "$stage/ferric.exe"
          Copy-Item "README.md" "$stage/README.md"
          Copy-Item "LICENSE" "$stage/LICENSE"
          Copy-Item "CHANGELOG.md" "$stage/CHANGELOG.md"
          Copy-Item "assets/brand/ferric.ico" "$stage/resources/ferric.ico"
          Copy-Item "assets/brand/ferric.png" "$stage/resources/ferric.png"
          Copy-Item "apps/ferric-desktop/resources/*" "$stage/makepad/ferric_desktop/resources/" -Recurse -Force
          Copy-Item "apps/ferric-desktop/resources/*" "$stage/makepad/ferric/resources/" -Recurse -Force

          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $lockRaw = Get-Content -Raw Cargo.lock
          $mwFilter = "makepad-widgets-*"
          if ($lockRaw -match '(?ms)name\s*=\s*"makepad-widgets"\r?\nversion\s*=\s*"([^"]+)"') {
            $mwFilter = "makepad-widgets-$($Matches[1])"
          }
          $mwRes = Get-ChildItem (Join-Path $cargoHome "registry/src") -Recurse -Directory -Filter $mwFilter |
            ForEach-Object { Join-Path $_.FullName "resources" } |
            Where-Object { Test-Path $_ } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $mwRes) {
            throw "Failed to locate $mwFilter resources directory under $cargoHome"
          }
          Copy-Item "$mwRes/*" "$stage/makepad/makepad_widgets/resources/" -Recurse -Force

          $zipName = "Ferric-$tag-windows-x86_64.zip"
          $zipPath = "dist/$zipName"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force

          $msiHash = (Get-FileHash -LiteralPath $msiPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash -LiteralPath "$stage/ferric.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = "$msiHash  $msiName`n$zipHash  $zipName`n$exeHash  ferric.exe`n"
          [IO.File]::WriteAllText((Join-Path $PWD "dist\SHA256SUMS.txt"), $sums, [Text.Encoding]::ASCII)

          $repoUrl = "https://github.com/$($env:GITHUB_REPOSITORY)"
          $runUrl = "$repoUrl/actions/runs/$($env:GITHUB_RUN_ID)"
          $changelogRaw = Get-Content -Raw -Encoding UTF8 "CHANGELOG.md"
          $escapedTag = [regex]::Escape($tag)
          $sectionPattern = "(?ms)^##\s+$escapedTag\b[^\r\n]*\r?\n(.*?)(?=^---\s*\r?\n|^##\s+v\d|\z)"
          $sectionBody = ""
          if ($changelogRaw -match $sectionPattern) {
            $sectionBody = $Matches[1].Trim()
          } else {
            throw "Missing '## $tag' section in CHANGELOG.md"
          }

          $prevTag = (& git tag --sort=-v:refname | Where-Object { $_ -ne $tag -and $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1)
          $lines = @(
            "## Ferric $tag",
            "",
            $sectionBody,
            "",
            "---",
            "",
            "### Download and verification",
            "",
            ('- [Windows x64 installer]({0}/releases/download/{1}/{2}) (`{2}`) — Per-user MSI installation' -f $repoUrl, $tag, $msiName),
            ('- [Portable ZIP]({0}/releases/download/{1}/{2}) (`{2}`) — Native executable, Makepad resources, and docs' -f $repoUrl, $tag, $zipName),
            ('- [SHA256SUMS.txt]({0}/releases/download/{1}/SHA256SUMS.txt)' -f $repoUrl, $tag),
            ('- [GitHub Actions build]({0}): formatting, Clippy, unit tests, PE hardening verification, release compilation, and installer build passed.' -f $runUrl),
            "",
            ('**Installer SHA256:** `{0}`' -f $msiHash),
            ('**Portable ZIP SHA256:** `{0}`' -f $zipHash),
            "",
            "### Installation notes",
            "",
            '- Unsigned build. Keep Windows security protections enabled and verify downloads against `SHA256SUMS.txt`.',
            '- Local credentials and cookies are encrypted at rest with Windows DPAPI (`CryptProtectData`) and removed completely on full uninstall.',
            '- Running or tray-minimized Ferric instances close automatically during MSI upgrade or uninstall for a clean file swap and full cleanup.'
          )
          if ($prevTag) {
            $lines += ""
            $lines += ('**Full Changelog:** [{0}...{1}]({2}/compare/{0}...{1})' -f $prevTag, $tag, $repoUrl)
          }
          $releaseNotes = ($lines -join "`n") + "`n"
          [IO.File]::WriteAllText((Join-Path $PWD "dist\RELEASE_NOTES.md"), $releaseNotes, [Text.Encoding]::UTF8)

      - name: Upload verified release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-payload
          path: |
            dist/ferricsetup-${{ github.ref_name }}.msi
            dist/Ferric-${{ github.ref_name }}-windows-x86_64.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
          retention-days: 5
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Ferric ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            dist/ferricsetup-${{ github.ref_name }}.msi
            dist/Ferric-${{ github.ref_name }}-windows-x86_64.zip
            dist/SHA256SUMS.txt
