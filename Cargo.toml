[workspace]
resolver = "2"
members = [
    "crates/ferric-core",
    "crates/ferric-audio",
    "crates/ferric-providers",
    "crates/ferric-sync",
    "crates/ferric-controller",
    "crates/ferric-mobile-ffi",
    "apps/ferric-desktop",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"
clone_on_ref_ptr = "warn"
format_push_string = "warn"
inefficient_to_string = "warn"
unnecessary_to_owned = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
large_stack_arrays = "warn"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.43", features = ["bundled"] }
directories = "6.0"
fastrand = "2.5"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-opus = "0.1.3"
rubato = "5.1.0"
cpal = "0.18.2"
oboe = "0.6.1"
uniffi = "0.33.0"
jni = "0.21.1"
ndk-context = "0.1.1"
rtrb = "0.4.1"
biquad = "0.6.0"
lofty = "0.25.5"
walkdir = "2.5"
aho-corasick = "1.1.5"
ureq = { version = "3.5", features = ["json"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
sha2 = "0.10"
postcard = { version = "1.2", features = ["use-std"] }
makepad-widgets = "1.0.0"
rfd = "0.18.0"
souvlaki = { version = "0.9.3", default-features = false }
winresource = "0.1.34"
webview2-com = "0.39.1"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
strip = "symbols"
panic = "abort"

[patch.crates-io]
makepad-platform = { path = "vendor/makepad-platform" }
makepad-draw = { path = "vendor/makepad-draw" }
