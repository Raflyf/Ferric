[workspace]
resolver = "2"
members = [
    "crates/ferric-core",
    "crates/ferric-audio",
    "crates/ferric-providers",
    "crates/ferric-sync",
    "apps/ferric-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
redundant_clone = "warn"
needless_collect = "warn"
large_enum_variant = "warn"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.43", features = ["bundled"] }
directories = "6.0"
fastrand = "2.5"
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-opus = "0.1.3"
rubato = "5.1.0"
cpal = "0.18.2"
rtrb = "0.4.1"
biquad = "0.6.0"
lofty = "0.25.5"
walkdir = "2.5"
aho-corasick = "1.1.5"
ureq = { version = "3.5", features = ["json"] }
postcard = { version = "1.2", features = ["use-std"] }
makepad-widgets = "1.0.0"
rfd = "0.18.0"
souvlaki = { version = "0.9.3", default-features = false }
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
